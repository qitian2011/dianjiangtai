<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3a0d0d">
<title>老师，教师节快乐！</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  :root {
    --bg-1:#3a0d0d;
    --bg-2:#7a1a1a;
    --bg-3:#b2522a;
    --ink:#fff7ec;
    --ink-dim:#f3dcc1;
    --gold:#ffd084;
    --gold-soft:#ffe9b8;
    --rose:#ffb3c1;
    --card:rgba(255,247,236,.08);
    --card-border:rgba(255,208,132,.35);
    --shadow:0 10px 28px rgba(0,0,0,.35);
  }
  html,body { margin:0; padding:0; }
  body {
    min-height:100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 15% -10%, #ff8a5b33, transparent 60%),
      radial-gradient(900px 600px at 110% 20%, #ffd08422, transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    background-attachment: fixed;
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body::before{
    content:"";
    position:fixed; inset:-10vh 0 auto 0; height:50vh;
    background: radial-gradient(ellipse at 50% 0%, #ffd08455, transparent 70%);
    pointer-events:none; z-index:0;
  }
  .stars{ position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.55; }
  .stars span{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:#ffe9b8; box-shadow:0 0 6px #ffe9b8;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.2; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.3);} }

  header.hero{
    position:relative; z-index:1;
    padding: 8vh 6vw 1.5vh;
    text-align:center;
  }
  .hero .date{ font-size:14px; letter-spacing:.4em; color:var(--gold-soft); opacity:.85; margin-bottom:.6em; }
  .hero h1{
    margin:0 auto .4em; max-width:14em;
    font-size: clamp(34px, 9vw, 56px);
    line-height:1.18; font-weight:900;
    color:var(--gold);
    text-shadow: 0 4px 18px rgba(0,0,0,.45);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe{ 0%,100%{ transform:translateY(0)} 50%{ transform:translateY(-4px)} }
  .hero .sub{ font-size:clamp(14px, 4vw, 18px); color:var(--ink-dim); letter-spacing:.15em; }

  main{
    position:relative; z-index:1;
    max-width: 680px; margin: 0 auto; padding: 1.5vh 5vw 10vh;
  }

  /* 一张完整贺卡：4 句祝福 + 落款同框 */
  .greet{
    margin: 10px 0 0;
    padding: clamp(28px, 7vw, 52px) clamp(20px, 6vw, 46px);
    background:
      radial-gradient(420px 180px at 50% 0%, rgba(255,224,138,.16), transparent 70%),
      linear-gradient(155deg, rgba(255,208,132,.14), rgba(255,247,236,.06) 50%, rgba(255,179,193,.09));
    border:1px solid var(--card-border);
    border-radius: 26px;
    box-shadow: var(--shadow), inset 0 0 60px rgba(255,208,132,.05);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    text-align:center;
    position:relative;
    transform: translateY(14px); opacity:0;
    animation: rise .9s cubic-bezier(.2,.7,.3,1) forwards;
  }
  /* 四角小花饰 */
  .greet .corn{ position:absolute; font-size:16px; opacity:.75; filter:drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
  .greet .corn.tl{ top:10px; left:14px; }
  .greet .corn.tr{ top:10px; right:14px; }
  .greet .corn.bl{ bottom:10px; left:14px; }
  .greet .corn.br{ bottom:10px; right:14px; }

  .gline{
    margin: .62em auto;
    font-size: clamp(19px, 5.6vw, 25px);
    line-height:1.9;
    color: var(--ink);
    letter-spacing:.05em;
    font-weight:600;
    text-shadow: 0 2px 10px rgba(0,0,0,.25);
    word-break: break-word;
    opacity:0;
    animation: rise .8s ease forwards;
  }
  .gline::before{ content:"✦ "; color:var(--gold); font-size:.72em; vertical-align:.15em; }
  .gline::after{ content:" ✦"; color:var(--gold); font-size:.72em; vertical-align:.15em; }

  /* 落款（同框底部分隔） */
  .sign{
    margin-top: clamp(16px, 4vw, 28px);
    padding-top: clamp(12px, 3vw, 20px);
    border-top: 1px dashed rgba(255,224,138,.45);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    opacity:0;
    animation: rise .9s .35s ease forwards;
  }
  .sign .flower{ font-size: clamp(18px, 5vw, 24px); filter:drop-shadow(0 3px 6px rgba(0,0,0,.3)); }
  .sign .who{
    font-size: clamp(18px, 5.4vw, 24px);
    font-weight:800; color:var(--gold);
    letter-spacing:.18em;
    text-shadow: 0 3px 12px rgba(0,0,0,.35);
  }
  .sign .wish{ font-size:13px; color:var(--ink-dim); letter-spacing:.32em; opacity:.85; }

  .foot{
    margin-top: 30px; padding: 10px 0 24px;
    text-align:center; color: var(--ink-dim); opacity:.7;
    font-size:13px; letter-spacing:.2em;
  }
  .foot .heart{ color: var(--rose); font-size:18px; }

  .empty{
    text-align:center; padding: 60px 24px; color: var(--ink-dim);
    border: 1px dashed rgba(255,224,138,.4); border-radius: 16px;
    background: rgba(0,0,0,.18);
  }
  .empty h2{ color: var(--gold); margin:0 0 .4em; font-weight:700; }
  .empty p{ margin:.3em 0; line-height:1.7; font-size:14px; }

  @keyframes rise { to { transform: translateY(0); opacity:1; } }

  @media (max-width: 380px){
    .greet{ padding: 26px 16px; }
  }
  @media (prefers-reduced-motion: reduce){
    .greet,.gline,.sign{ animation:none; transform:none; opacity:1; }
    .hero h1{ animation:none; }
    .stars span{ animation:none; }
  }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>

<header class="hero">
  <div class="date">2026 · 九月十日</div>
  <h1>老师，教师节快乐！</h1>
  <div class="sub">—— 致最敬爱的您 ——</div>
</header>

<main id="cards">
  <!-- 由 JS 注入 -->
</main>

<div class="foot">
  <div>每一句祝福，都来自 <span class="heart">❤</span> 心底</div>
  <div style="margin-top:.4em; opacity:.7;">点将台 · 教师节贺卡</div>
</div>

<script>
/* ============================================================================
 * 教师节祝福贺卡 —— 单框完整贺卡
 * 结构：
 *   TITLE     页头大标题
 *   BLESSINGS 祝福语句数组（同框内逐句排列）
 *   SIGN      落款（班级/署名）
 *   SIGN_WISH 落款副行
 * 兼容：也支持 URL ?data=<base64(JSON)> 整体覆盖 { title, bless, sign, signWish }
 * ========================================================================== */
const TITLE = '老师，教师节快乐！';
const BLESSINGS = [
  '薪火相传，心灯不灭',
  '老师，我们很喜欢上您的课',
  '三寸笔，三尺讲台，三千桃李',
  '老师您辛苦了，我们因您的教导而受益匪浅！',
];
const SIGN = '初三（2）班全体同学';
const SIGN_WISH = '敬上 · 2026 教师节';

/* —— URL 注入覆盖（可选）—— */
function decodeData(){
  try{
    const p = new URLSearchParams(location.search).get('data');
    if(!p) return null;
    const json = decodeURIComponent(escape(atob(p)));
    return JSON.parse(json);
  }catch(e){ console.warn('[card] data 参数解析失败', e); }
  return null;
}

/* —— 星点 —— */
(function buildStars(){
  const box = document.querySelector('.stars');
  if(!box) return;
  for(let i=0;i<25;i++){
    const s=document.createElement('span');
    s.style.left = (Math.random()*100)+'%';
    s.style.top  = (Math.random()*100)+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    s.style.opacity = (.3+Math.random()*.7).toFixed(2);
    box.appendChild(s);
  }
})();

/* —— 渲染 —— */
function esc(s){ return String(s==null?'':s).replace(/[<>&]/g, ch => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[ch])); }

function render(opt){
  const root = document.getElementById('cards');
  root.innerHTML = '';
  const title = opt.title || TITLE;
  const list  = Array.isArray(opt.bless) && opt.bless.length ? opt.bless : BLESSINGS;
  const sign  = opt.sign || SIGN;
  const wish  = opt.signWish || SIGN_WISH;
  document.querySelector('.hero h1').textContent = title;

  if(!list.length){
    root.innerHTML = `
      <div class="empty">
        <h2>🌸 祝福正在路上</h2>
        <p>这张贺卡的祝福文本还未填入。</p>
        <p>请编辑 <code>card.html</code> 里的 <b>BLESSINGS</b> 数组后重新部署即可。</p>
      </div>`;
    return;
  }

  // 单框贺卡
  const frame = document.createElement('article');
  frame.className = 'greet';
  frame.innerHTML = `
    <span class="corn tl">🌸</span><span class="corn tr">🌹</span>
    <span class="corn bl">🌷</span><span class="corn br">⭐</span>`;
  list.forEach((msg, idx) => {
    const p = document.createElement('p');
    p.className = 'gline';
    p.style.animationDelay = (idx*140) + 'ms';
    p.textContent = msg;
    frame.appendChild(p);
  });
  const sg = document.createElement('div');
  sg.className = 'sign';
  sg.innerHTML = `
    <div class="flower">🌸🌹🌸</div>
    <div class="who">${esc(sign)}</div>
    <div class="wish">${esc(wish)}</div>`;
  frame.appendChild(sg);
  root.appendChild(frame);
}

/* —— 启动 —— */
const override = decodeData() || {};
render(override);
</script>

</body>
</html>
